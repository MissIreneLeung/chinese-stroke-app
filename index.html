<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字筆順大挑戰</title>
  <!-- 載入 Hanzi Writer CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #0277bd;
      margin-bottom: 15px;
    }
    .control-panel {
      background-color: white;
      max-width: 500px;
      margin: 0 auto 15px auto;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .input-group, .voice-group, .category-group {
      margin-bottom: 12px;
    }
    input[type="text"] {
      padding: 8px 12px;
      font-size: 18px;
      width: 140px;
      text-align: center;
      border: 2px solid #0277bd;
      border-radius: 6px;
      outline: none;
    }
    select {
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #0277bd;
      border-radius: 6px;
      background-color: white;
      outline: none;
      cursor: pointer;
      margin: 3px;
    }
    button {
      padding: 8px 16px;
      font-size: 15px;
      background-color: #0277bd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover {
      background-color: #01579b;
    }
    .btn-audio {
      background-color: #ff9800;
    }
    .btn-audio:hover {
      background-color: #f57c00;
    }
    .btn-nav {
      background-color: #4caf50;
    }
    .btn-nav:hover {
      background-color: #388e3c;
    }
    .btn-nav:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .word-bank {
      margin: 10px 0;
    }
    .word-btn {
      background-color: white;
      color: #0277bd;
      border: 1px solid #0277bd;
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      margin: 4px;
      cursor: pointer;
    }
    .word-btn:hover {
      background-color: #e1f5fe;
    }
    .word-btn.active {
      background-color: #0277bd;
      color: white;
    }
    /* 米字格寫字框容器 */
    .target-box {
      width: 300px;
      height: 300px;
      border: 3px solid #de2910; /* 中式朱紅邊框 */
      position: relative;
      background-color: #fff8f0; /* 米黃宣紙底色 */
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: 15px auto;
    }
    .progress-text {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 10px 0 5px 0;
    }
  </style>
</head>
<body>

  <h1>漢字筆順大挑戰</h1>

  <div class="control-panel">
    <!-- 自訂輸入多字詞語 -->
    <div class="input-group">
      <input type="text" id="char-input" value="學習" placeholder="請輸入單字或詞語">
      <button onclick="loadCustomWord()">載入詞語</button>
    </div>

    <!-- 主題分類選單 -->
    <div class="category-group">
      <label for="category-select"><strong>主題分類：</strong></label>
      <select id="category-select" onchange="changeCategory()">
        <option value="grade1">一年級常用字</option>
        <option value="animals">可愛動物</option>
        <option value="body">身體部位</option>
        <option value="nature">自然現象</option>
      </select>
    </div>

    <!-- 常用詞語庫 -->
    <div class="word-bank" id="word-bank-container">
      <!-- 動態生成詞語按鈕 -->
    </div>

    <!-- 發音語言選擇與朗讀 -->
    <div class="voice-group">
      <label for="lang-select"><strong>發音語言：</strong></label>
      <select id="lang-select">
        <option value="zh-HK">粵語 (廣東話)</option>
        <option value="zh-TW" selected>國語 (普通話)</option>
      </select>
      <button class="btn-audio" onclick="speakCurrentChar()">🔊 播放發音</button>
    </div>
  </div>

  <!-- 多字詞語進度與導覽 -->
  <div class="progress-text" id="progress-indicator">字詞進度：1 / 2</div>

  <div class="nav-group">
    <button class="btn-nav" id="btn-prev" onclick="prevChar()">⬅️ 上一字</button>
    <button class="btn-nav" id="btn-next" onclick="nextChar()">下一字 ➡️</button>
  </div>

  <!-- 米字格寫字框容器 -->
  <div id="grid-container" class="target-box"></div>

  <div>
    <button onclick="animateChar()">觀看示範</button>
    <button onclick="quizChar()">開始練習</button>
  </div>

  <script>
    // 主題分類詞庫資料
    const categories = {
      grade1: ['學習', '學校', '朋友', '老師', '大小', '多少'],
      animals: ['小狗', '小貓', '飛鳥', '游魚', '白兔', '大象'],
      body: ['眼睛', '雙手', '雙腳', '耳朵', '嘴巴', '頭髮'],
      nature: ['太陽', '月亮', '白雲', '下雨', '大山', '流水']
    };

    let currentWord = "學習";
    let currentIndex = 0;
    let writer;

    // 初始化與載入分類按鈕
    function changeCategory() {
      const selectedCat = document.getElementById('category-select').value;
      const wordList = categories[selectedCat];
      const bankContainer = document.getElementById('word-bank-container');
      bankContainer.innerHTML = '';

      wordList.forEach((word, idx) => {
        const btn = document.createElement('button');
        btn.className = 'word-btn' + (idx === 0 ? ' active' : '');
        btn.innerText = word;
        btn.onclick = () => selectWord(word, btn);
        bankContainer.appendChild(btn);
      });

      // 載入該分類第一個詞語
      if (wordList.length > 0) {
        selectWord(wordList[0]);
      }
    }

    // 選擇特定詞語
    function selectWord(word, targetBtn) {
      currentWord = word;
      currentIndex = 0;
      document.getElementById('char-input').value = word;

      // 更新按鈕高亮狀態
      const buttons = document.querySelectorAll('.word-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (targetBtn) {
        targetBtn.classList.add('active');
      }

      loadCharAtIndex();
    }

    // 載入自訂輸入框的詞語
    function loadCustomWord() {
      const val = document.getElementById('char-input').value.trim();
      if (val) {
        currentWord = val;
        currentIndex = 0;
        // 清除按鈕高亮
        document.querySelectorAll('.word-btn').forEach(btn => btn.classList.remove('active'));
        loadCharAtIndex();
      }
    }

    // 依據索引載入當前單字與更新控制按鈕
    function loadCharAtIndex() {
      if (currentWord.length === 0) return;

      const currentChar = currentWord[currentIndex];
      
      // 更新進度顯示
      document.getElementById('progress-indicator').innerText = 
        `詞語：「${currentWord}」 （第 ${currentIndex + 1} / ${currentWord.length} 字：${currentChar}）`;

      // 更新上一字/下一字按鈕狀態
      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      document.getElementById('btn-next').disabled = (currentIndex === currentWord.length - 1);

      // 初始化 Hanzi Writer
      initWriter(currentChar);
    }

    // 上一字 / 下一字
    function prevChar() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCharAtIndex();
      }
    }

    function nextChar() {
      if (currentIndex < currentWord.length - 1) {
        currentIndex++;
        loadCharAtIndex();
      }
    }

    // 繪製米字格 SVG 背景
    function drawRiceGrid(svg) {
      const size = 300;
      const half = size / 2;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('stroke', '#e8b4b4'); // 柔和米字格虛線
      group.setAttribute('stroke-dasharray', '4 4');
      group.setAttribute('stroke-width', '1');

      const lines = [
        `M 0 ${half} L ${size} ${half}`,
        `M ${half} 0 L ${half} ${size}`,
        `M 0 0 L ${size} ${size}`,
        `M ${size} 0 L 0 ${size}`
      ];

      lines.forEach(pathData => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        group.appendChild(path);
      });

      svg.appendChild(group);
    }

    // 初始化 Hanzi Writer
    function initWriter(character) {
      document.getElementById('grid-container').innerHTML = '';
      writer = HanziWriter.create('grid-container', character, {
        width: 300,
        height: 300,
        padding: 10,
        showOutline: true,
        strokeColor: '#000000',
        outlineColor: '#ddd',
        drawingColor: '#333',
        onRender: function(svg) {
          drawRiceGrid(svg);
        }
      });
      // 自動朗讀當前單字
      speakCurrentChar();
    }

    // 語音朗讀功能 (Web Speech API)
    function speakCurrentChar() {
      if (currentWord.length === 0) return;
      const currentChar = currentWord[currentIndex];

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(currentChar);
        const selectedLang = document.getElementById('lang-select').value;
        utterance.lang = selectedLang;
        utterance.rate = 0.8;

        window.speechSynthesis.speak(utterance);
      }
    }

    function animateChar() {
      if (writer) writer.animateCharacter();
    }

    function quizChar() {
      if (writer) writer.quiz();
    }

    // 頁面載入時初始化
    window.onload = function() {
      changeCategory();
    };
  </script>

</body>
</html>
