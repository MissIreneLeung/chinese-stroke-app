<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字筆順大挑戰</title>
  <!-- 載入 Hanzi Writer CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #0277bd;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    input[type="text"] {
      padding: 8px 12px;
      font-size: 18px;
      width: 120px;
      text-align: center;
      border: 2px solid #0277bd;
      border-radius: 6px;
      outline: none;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      background-color: #0277bd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #01579b;
    }
    .word-bank {
      margin: 15px 0;
    }
    .word-btn {
      background-color: white;
      color: #0277bd;
      border: 1px solid #0277bd;
      padding: 5px 10px;
      font-size: 16px;
      border-radius: 4px;
      margin: 3px;
    }
    .word-btn:hover {
      background-color: #e1f5fe;
    }
    /* 米字格寫字框容器 */
    .target-box {
      width: 300px;
      height: 300px;
      border: 3px solid #de2910; /* 中式朱紅邊框 */
      position: relative;
      background-color: #fff8f0; /* 米黃宣紙底色 */
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: 15px auto;
    }
  </style>
</head>
<body>

  <h1>漢字筆順大挑戰</h1>

  <div class="input-group">
    <input type="text" id="char-input" value="永" maxlength="1">
    <button onclick="updateChar()">載入漢字</button>
  </div>

  <div class="word-bank">
    常用字詞庫：<br>
    <button class="word-btn" onclick="setChar('永')">永</button>
    <button class="word-btn" onclick="setChar('花')">花</button>
    <button class="word-btn" onclick="setChar('草')">草</button>
    <button class="word-btn" onclick="setChar('山')">山</button>
    <button class="word-btn" onclick="setChar('水')">水</button>
    <button class="word-btn" onclick="setChar('愛')">愛</button>
    <button class="word-btn" onclick="setChar('學')">學</button>
  </div>

  <!-- 寫字框容器 -->
  <div id="grid-container" class="target-box"></div>

  <div>
    <button onclick="animateChar()">觀看示範</button>
    <button onclick="quizChar()">開始練習</button>
  </div>

  <script>
    let writer;

    // 繪製米字格 SVG 背景
    function drawRiceGrid(svg) {
      const size = 300;
      const half = size / 2;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('stroke', '#e8b4b4'); // 柔和米字格虛線
      group.setAttribute('stroke-dasharray', '4 4');
      group.setAttribute('stroke-width', '1');

      const lines = [
        `M 0 ${half} L ${size} ${half}`, // 橫虛線
        `M ${half} 0 L ${half} ${size}`, // 豎虛線
        `M 0 0 L ${size} ${size}`,       // 對角線 1
        `M ${size} 0 L 0 ${size}`        // 對角線 2
      ];

      lines.forEach(pathData => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        group.appendChild(path);
      });

      svg.appendChild(group);
    }

    // 初始化 Hanzi Writer
    function initWriter(character) {
      document.getElementById('grid-container').innerHTML = '';
      writer = HanziWriter.create('grid-container', character, {
        width: 300,
        height: 300,
        padding: 10,
        showOutline: true,
        strokeColor: '#000000',
        outlineColor: '#ddd',
        drawingColor: '#333',
        onRender: function(svg) {
          drawRiceGrid(svg);
        }
      });
    }

    function updateChar() {
      const char = document.getElementById('char-input').value.trim();
      if (char) {
        initWriter(char[0]);
      }
    }

    function setChar(char) {
      document.getElementById('char-input').value = char;
      initWriter(char);
    }

    function animateChar() {
      if (writer) writer.animateCharacter();
    }

    function quizChar() {
      if (writer) writer.quiz();
    }

    // 頁面載入時初始化預設字
    window.onload = function() {
      initWriter('永');
    };
  </script>

</body>
</html>
