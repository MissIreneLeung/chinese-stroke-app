<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小學漢字筆順大挑戰</title>
  <!-- 載入 Hanzi Writer CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #0277bd;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }
    .control-panel {
      background-color: white;
      max-width: 520px;
      margin: 0 auto 15px auto;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .student-info-group, .input-group, .voice-group, .category-group {
      margin-bottom: 12px;
    }
    .student-info-group input {
      padding: 6px 10px;
      font-size: 15px;
      width: 100px;
      margin: 3px;
      border: 1px solid #0277bd;
      border-radius: 4px;
      text-align: center;
    }
    input[type="text"] {
      padding: 8px 12px;
      font-size: 18px;
      width: 140px;
      text-align: center;
      border: 2px solid #0277bd;
      border-radius: 6px;
      outline: none;
    }
    select {
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #0277bd;
      border-radius: 6px;
      background-color: white;
      outline: none;
      cursor: pointer;
      margin: 3px;
    }
    button {
      padding: 8px 16px;
      font-size: 15px;
      background-color: #0277bd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover {
      background-color: #01579b;
    }
    .btn-audio {
      background-color: #ff9800;
    }
    .btn-audio:hover {
      background-color: #f57c00;
    }
    .btn-nav {
      background-color: #4caf50;
    }
    .btn-nav:hover {
      background-color: #388e3c;
    }
    .btn-nav:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .word-bank {
      margin: 10px 0;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }
    .word-btn {
      background-color: white;
      color: #0277bd;
      border: 1px solid #0277bd;
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      margin: 4px;
      cursor: pointer;
    }
    .word-btn:hover {
      background-color: #e1f5fe;
    }
    .word-btn.active {
      background-color: #0277bd;
      color: white;
    }
    /* 米字格寫字框容器 */
    .target-box {
      width: 300px;
      height: 300px;
      border: 3px solid #de2910;
      position: relative;
      background-color: #fff8f0;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: 15px auto;
    }
    .progress-text {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 10px 0 5px 0;
    }
    #status-msg {
      font-size: 14px;
      color: #2e7d32;
      font-weight: bold;
      height: 20px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>漢字筆順大挑戰</h1>
  <div class="subtitle">參考香港教育局《香港小學學習字詞表》設計</div>

  <div class="control-panel">
    <!-- 學生個人資訊（用於傳送數據至 Google Sheets） -->
    <div class="student-info-group">
      <label><strong>班級/座號：</strong></label>
      <input type="text" id="student-class" placeholder="例: 1A(05)">
      <label><strong>姓名：</strong></label>
      <input type="text" id="student-name" placeholder="例: 陳小明">
    </div>

    <!-- 自訂輸入多字詞語 -->
    <div class="input-group">
      <input type="text" id="char-input" value="學習" placeholder="請輸入單字或詞語">
      <button onclick="loadCustomWord()">載入詞語</button>
    </div>

    <!-- 香港教育局小一至小六課程分類選單 -->
    <div class="category-group">
      <label for="category-select"><strong>字詞類別：</strong></label>
      <select id="category-select" onchange="changeCategory()">
        <option value="primary1">小一核心字詞</option>
        <option value="primary2">小二進階字詞</option>
        <option value="primary3">小三提升字詞</option>
        <option value="primary4">小四高階字詞</option>
        <option value="primary5">小五深化字詞</option>
        <option value="primary6">小六畢業字詞</option>
        <option value="idioms">常用四字成語</option>
        <option value="hk_places">香港地名與生活</option>
        <option value="virtues">品格與情感</option>
      </select>
    </div>

    <!-- 常用詞語庫 -->
    <div class="word-bank" id="word-bank-container"></div>

    <!-- 發音語言選擇與朗讀 -->
    <div class="voice-group">
      <label for="lang-select"><strong>發音語言：</strong></label>
      <select id="lang-select">
        <option value="zh-HK" selected>粵語 (廣東話)</option>
        <option value="zh-TW">國語 (普通話)</option>
      </select>
      <button class="btn-audio" onclick="speakCurrentChar()">🔊 播放發音</button>
    </div>
  </div>

  <!-- 多字詞語進度與導覽 -->
  <div class="progress-text" id="progress-indicator">字詞進度：1 / 2</div>

  <div class="nav-group">
    <button class="btn-nav" id="btn-prev" onclick="prevChar()">⬅️ 上一字</button>
    <button class="btn-nav" id="btn-next" onclick="nextChar()">下一字 ➡️</button>
  </div>

  <!-- 米字格寫字框容器 -->
  <div id="grid-container" class="target-box"></div>

  <div>
    <button onclick="animateChar()">觀看示範</button>
    <button onclick="quizChar()">開始練習</button>
  </div>
  
  <div id="status-msg"></div>

  <script>
    // 💡 若有 Google Apps Script URL 請填入雙引號內；若無則保留空字串 ""
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaJRaXNKz8Tyx1fcYgo0Mw0Eu9dpHUVOdQwbTcYkiFMobrGipCHDzTxNw1G9rH3Nq2Uw/exec";

    const edbCategories = {
      primary1: ['學習', '學校', '老師', '同學', '爸爸', '媽媽', '朋友', '寫字', '讀書', '開心', '看書', '身體'],
      primary2: ['禮貌', '整理', '照顧', '互相', '幫助', '合作', '勤力', '美麗', '健康', '環境', '保護', '分享'],
      primary3: ['珍惜', '勇敢', '堅強', '鼓勵', '討論', '觀察', '創新', '思考', '負責任', '尊重', '感謝', '豐富'],
      primary4: ['氣候', '資源', '繁榮', '奧秘', '探索', '經驗', '價值', '傳統', '發展', '貢獻', '關懷', '體諒'],
      primary5: ['展覽', '經濟', '成就', '影響', '結構', '概念', '邏輯', '系統', '綜合', '分析', '效率', '敏捷'],
      primary6: ['抱負', '國際', '宏觀', '維護', '轉折', '哲理', '素質', '趨勢', '理想', '卓越', '前瞻', '淵博'],
      idioms: ['持之以恆', '自強不息', '溫故知新', '迎難而上', '博覽群書', '同心協力', '循序漸進', '專心致志'],
      hk_places: ['香港', '九龍', '新界', '海港', '公園', '圖書館', '博物館', '車站', '學校', '街道'],
      virtues: ['誠實', '善良', '守時', '友愛', '專心', '謙虛', '和諧', '感謝', '堅毅']
    };

    let currentWord = "學習";
    let currentIndex = 0;
    let writer;

    function changeCategory() {
      const selectedCat = document.getElementById('category-select').value;
      const wordList = edbCategories[selectedCat];
      const bankContainer = document.getElementById('word-bank-container');
      bankContainer.innerHTML = '';

      if (wordList) {
        wordList.forEach((word, idx) => {
          const btn = document.createElement('button');
          btn.className = 'word-btn' + (idx === 0 ? ' active' : '');
          btn.innerText = word;
          btn.onclick = () => selectWord(word, btn);
          bankContainer.appendChild(btn);
        });

        if (wordList.length > 0) {
          selectWord(wordList[0]);
        }
      }
    }

    function selectWord(word, targetBtn) {
      currentWord = word;
      currentIndex = 0;
      document.getElementById('char-input').value = word;

      const buttons = document.querySelectorAll('.word-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (targetBtn) {
        targetBtn.classList.add('active');
      }

      loadCharAtIndex();
    }

    function loadCustomWord() {
      const val = document.getElementById('char-input').value.trim();
      if (val) {
        currentWord = val;
        currentIndex = 0;
        document.querySelectorAll('.word-btn').forEach(btn => btn.classList.remove('active'));
        loadCharAtIndex();
      }
    }

    function loadCharAtIndex() {
      if (!currentWord || currentWord.length === 0) return;

      const currentChar = currentWord[currentIndex];
      
      document.getElementById('progress-indicator').innerText = 
        `詞語：「${currentWord}」（第 ${currentIndex + 1} / ${currentWord.length} 字：${currentChar}）`;

      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      document.getElementById('btn-next').disabled = (currentIndex === currentWord.length - 1);

      initWriter(currentChar);
    }

    function prevChar() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCharAtIndex();
      }
    }

    function nextChar() {
      if (currentIndex < currentWord.length - 1) {
        currentIndex++;
        loadCharAtIndex();
      }
    }

    function drawRiceGrid(svg) {
      const size = 300;
      const half = size / 2;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('stroke', '#e8b4b4');
      group.setAttribute('stroke-dasharray', '4 4');
      group.setAttribute('stroke-width', '1');

      const lines = [
        `M 0 ${half} L ${size} ${half}`,
        `M ${half} 0 L ${half} ${size}`,
        `M 0 0 L ${size} ${size}`,
        `M ${size} 0 L 0 ${size}`
      ];

      lines.forEach(pathData => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        group.appendChild(path);
      });

      svg.appendChild(group);
    }

    function initWriter(character) {
      document.getElementById('grid-container').innerHTML = '';
      document.getElementById('status-msg').innerText = '';

      writer = HanziWriter.create('grid-container', character, {
        width: 300,
        height: 300,
        padding: 10,
        showOutline: true,
        strokeColor: '#000000',
        outlineColor: '#ddd',
        drawingColor: '#333',
        onRender: function(svg) {
          drawRiceGrid(svg);
        }
      });
      speakCurrentChar();
    }

    function animateChar() {
      if (writer) writer.animateCharacter();
    }

    function quizChar() {
      if (!writer) return;
      
      writer.quiz({
        onComplete: function(summary) {
          const totalMistakes = summary.totalMistakes;
          let stars = "⭐⭐⭐ (太棒了)";
          if (totalMistakes > 2 && totalMistakes <= 5) stars = "⭐⭐ (加油)";
          if (totalMistakes > 5) stars = "⭐ (再試一次)";

          alert(`🎉 恭喜完成「${currentWord[currentIndex]}」字練習！\n錯誤筆劃數：${totalMistakes}\n評分：${stars}`);

          uploadProgressToSheets(totalMistakes, stars);
        }
      });
    }

    function uploadProgressToSheets(mistakes, stars) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === "") {
        return;
      }

      const sName = document.getElementById('student-name').value.trim();
      const sClass = document.getElementById('student-class').value.trim();

      document.getElementById('status-msg').innerText = "正在記錄學習進度至雲端...";

      const payload = {
        studentName: sName || "未填寫",
        studentClass: sClass || "未填寫",
        word: currentWord,
        character: currentWord[currentIndex],
        mistakes: mistakes,
        stars: stars
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('status-msg').innerText = "✅ 練習紀錄已成功儲存至試算表！";
      })
      .catch(err => {
        console.error("Upload error:", err);
        document.getElementById('status-msg').innerText = "⚠️ 數據記錄失敗。";
      });
    }

    function speakCurrentChar() {
      if (!currentWord || currentWord.length === 0) return;
      const currentChar = currentWord[currentIndex];

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentChar);
        const selectedLang = document.getElementById('lang-select').value;
        utterance.lang = selectedLang;
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    window.onload = function() {
      changeCategory();
    };
  </script>

</body>
</html>
